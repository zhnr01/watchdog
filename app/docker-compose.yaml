version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: watchdog-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: watchdog
    ports:
      - "5432:5432"
    volumes:
      - watchdog_pgdata:/var/lib/postgresql/data

volumes:
  watchdog_pgdata: